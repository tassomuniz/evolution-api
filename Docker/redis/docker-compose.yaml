version: '3.3'

services:
  redis:
    image: redis:latest
    networks:
      - evolution-net
    container_name: redis
    command: >
      redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - evolution_redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379

volumes:
  evolution_redis:


networks:
  evolution-net:
    name: evolution-net
    driver: bridge
